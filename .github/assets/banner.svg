<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Rold Harness</title>
  <desc id="d">The Rold Harness logo and name beside a card where the agent works through a task and asks for approval before sending.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="420" rx="20"/></clipPath>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#ff8a5c"/></linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.1" r="0.7"><stop offset="0" stop-color="#8b7bff" stop-opacity="0.38"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="1" r="0.6"><stop offset="0" stop-color="#ff8a5c" stop-opacity="0.26"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/></pattern>
    <style>
      .f { font-family: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#141318"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glowA)"/>
    <rect width="1280" height="420" fill="url(#glowB)"/>

    <!-- Logo and name -->
    <g transform="translate(96 92)">
      <rect width="92" height="92" rx="26" fill="url(#logo)"/>
      <path transform="scale(2.875)" d="M16 6.5c.9 4.8 3.7 7.6 8.5 8.5-4.8.9-7.6 3.7-8.5 8.5-.9-4.8-3.7-7.6-8.5-8.5 4.8-.9 7.6-3.7 8.5-8.5z" fill="#fff"/>
    </g>
    <text class="f" x="92" y="282" font-size="84" font-weight="700" fill="#f4f2ee" letter-spacing="-2">Rold Harness</text>
    <text class="f" x="96" y="330" font-size="28" fill="#b9b6ae">Your new tab is an AI agent.</text>

    <!-- Provider chips -->
    <g class="f" font-size="17" font-weight="600">
      <rect x="96" y="352" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="116" cy="369" r="5" fill="#d97757"/>
      <text x="128" y="375" fill="#e7e4dd">Claude</text>
      <rect x="202" y="352" width="114" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="222" cy="369" r="5" fill="#10a37f"/>
      <text x="234" y="375" fill="#e7e4dd">ChatGPT</text>
      <rect x="326" y="352" width="122" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="346" cy="369" r="5" fill="#9a8cff"/>
      <text x="358" y="375" fill="#e7e4dd">OpenCode</text>
    </g>

    <!-- Agent card -->
    <g class="f" transform="translate(748 58)">
      <rect width="440" height="304" rx="20" fill="#000" fill-opacity="0.35" transform="translate(0 10)"/>
      <rect width="440" height="304" rx="20" fill="#1f1e1c" stroke="#ffffff" stroke-opacity="0.1"/>
      <path d="M27 24 l9 3.5 v6.5 c0 5.5 -4 8.5 -9 10.5 c-5 -2 -9 -5 -9 -10.5 v-6.5z" fill="none" stroke="#34c77b" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="48" y="42" font-size="17" fill="#cfccc4">Waiting for your approval</text>
      <line x1="0" y1="66" x2="440" y2="66" stroke="#ffffff" stroke-opacity="0.08"/>

      <g font-size="16" fill="#ecebe7">
        <rect x="24" y="86" width="16" height="13" rx="3" fill="none" stroke="#8f8c85" stroke-width="1.6"/>
        <text x="54" y="99">Opening mail.example.com</text>
        <rect x="24" y="124" width="16" height="13" rx="3" fill="none" stroke="#8f8c85" stroke-width="1.6"/>
        <text x="54" y="137">Scanning page controls</text>
        <path d="M27 162 l10 4 -4 2 3 5 -2 1 -3 -5 -3 3z" fill="#8f8c85"/>
        <text x="54" y="175">Clicking “Ana — Dinner on Friday?”</text>
        <rect x="24" y="200" width="16" height="12" rx="2.5" fill="none" stroke="#8f8c85" stroke-width="1.6"/>
        <text x="54" y="213">Typing “Hi Ana! I’ll be there at 6.”</text>
      </g>

      <rect x="18" y="234" width="404" height="52" rx="12" fill="#9a8cff" fill-opacity="0.1" stroke="#9a8cff" stroke-opacity="0.75"/>
      <text x="36" y="258" font-size="15" font-weight="700" fill="#f4f2ee">Approve this action?</text>
      <text x="36" y="276" font-size="13" fill="#b9b6ae">Click “Send” on mail.example.com</text>
      <rect x="320" y="245" width="88" height="30" rx="8" fill="#f4f2ee"/>
      <text x="364" y="265" font-size="14" font-weight="700" fill="#1d1c1a" text-anchor="middle">Approve</text>
    </g>
  </g>
</svg>
