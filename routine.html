<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rold routine</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    :root { --canvas: #f0f0ee; --bg: #ffffff; --text: #18181b; --text-3: #71717a; --line: #e8e8e5; --shadow-sheet: 0 0 0 1px rgba(16, 16, 20, 0.05), 0 1px 2px rgba(16, 16, 20, 0.04), 0 10px 30px -12px rgba(16, 16, 20, 0.12); color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --canvas: #0e0e0f; --bg: #18181a; --text: #ececec; --text-3: #8b8b93; --line: #2b2b2f; --shadow-sheet: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 10px 32px -8px rgba(0, 0, 0, 0.7); color-scheme: dark; }
    }
    body { font: 15px/1.6 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--text); -webkit-font-smoothing: antialiased; }
    main { width: min(560px, calc(100% - 32px)); box-sizing: border-box; padding: 28px 32px 30px; background: var(--bg); border-radius: 14px; box-shadow: var(--shadow-sheet); }
    .label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin: 6px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    #status { color: var(--text-3); white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <main>
    <div class="label"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Rold routine</div>
    <h1 id="name">Routine</h1>
    <div id="status">Starting</div>
  </main>
  <script type="module" src="js/runner.js"></script>
</body>
</html>
