<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rold Harness routine</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    :root { --bg: #fbfbfa; --text: #18181b; --text-3: #71717a; --line: #e7e7e4; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141415; --text: #ececec; --text-3: #8b8b93; --line: #2a2a2d; color-scheme: dark; }
    }
    body { font: 15px/1.6 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    main { width: min(520px, calc(100% - 32px)); }
    .label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin: 6px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    #status { color: var(--text-3); white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <main>
    <div class="label"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Rold Harness routine</div>
    <h1 id="name">Routine</h1>
    <div id="status">Starting</div>
  </main>
  <script type="module" src="js/runner.js"></script>
</body>
</html>
